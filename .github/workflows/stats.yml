name: stats

# 每天刷新一次 stats.json（关于页最下方那张访客图的数据源）。
# 需要两个仓库 secret：GOATCOUNTER_SITE（站点短代码，如 x1shang）与 GOATCOUNTER_TOKEN。
# 没配 secret 时脚本会打印“跳过”并正常退出，不会产生提交。
# 注：GitHub 会在仓库连续 60 天没有活动后暂停定时任务，随便 push 一次即可恢复。

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC（北京 11:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取访客统计
        env:
          GOATCOUNTER_SITE: ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node tools/fetch-stats.mjs

      - name: 有变化就提交
        run: |
          if git diff --quiet -- stats.json; then
            echo "stats.json 没有变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "chore(stats): 刷新访客统计 $(date -u +%Y-%m-%d)"
          git push
