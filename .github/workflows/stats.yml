name: stats

# 每天刷新 stats.json（关于页最下方那张访客图 + 文章热度都靠它）。
# 需要两个仓库 secret：GOATCOUNTER_SITE（站点短代码，如 x1shang）与 GOATCOUNTER_TOKEN。
# 没配 secret 时脚本会打印“跳过”并正常退出，不会产生提交。
# 抓完会重建内容包与预渲染页，并把文章热度一起提交。
# 注：GitHub 会在仓库连续 60 天没有活动后暂停定时任务，随便 push 一次即可恢复。
#
# 2026-10-15：一天跑两次（撞上上游抽风也不至于整天没数据；无变化时不产生提交）——
# 当天 03:17 UTC 那次就是被 GoatCounter 间歇性 RST 掉、整天没数据，脚本窗口是最近 30 天，重跑即自动回填。
#
# 2026-10-16（Phase 3 §6.1）：接入自建统计 stat.x1shang.top（Workers + D1）。
#   · secrets：STATS_API_URL / STATS_API_TOKEN（已加）
#   · **双跑**：每次运行都同时取 GoatCounter 与自建两边，对比写进 Job Summary + tools/stat-dual-run.log（**不进 stats.json**）
#   · 站上显示哪一侧由仓库 **Variable** `STATS_PROVIDER` 决定：缺省/`goatcounter` = 现状不变；
#     想切到自建就在 Settings → Variables 里设成 `selfhosted`（或用 `gh variable set STATS_PROVIDER --body selfhosted`），
#     自建 v2 与 GoatCounter 均按页 visits（会话内同页去重），都不是全站独立人数；
#     旧 PV 单独保留，自建 visits 从 API 的 since 起累计。

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC（北京 11:17）
    - cron: '17 15 * * *'  # 每天 15:17 UTC（北京 23:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取访客统计（含按页总量 + 双跑对比）
        env:
          GOATCOUNTER_SITE: ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          STATS_API_URL: ${{ secrets.STATS_API_URL }}
          STATS_API_TOKEN: ${{ secrets.STATS_API_TOKEN }}
          STATS_PROVIDER: ${{ vars.STATS_PROVIDER }}
        run: node tools/fetch-stats.mjs

      - name: 重建内容包（把访客量写成文章热度）+ 预渲染页 + sitemap
        run: node tools/build-content.mjs

      - name: 有变化就提交
        run: |
          if git diff --quiet -- stats.json content.auto.js feed.xml atom.xml sitemap.xml articles assertions academic tools/stat-dual-run.log; then
            echo "没有变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json content.auto.js feed.xml atom.xml sitemap.xml articles assertions academic tools/stat-dual-run.log
          git commit -m "chore(stats): 刷新访客统计与文章热度 $(date -u +%Y-%m-%d)"
          git push
