<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>替代心声 · 原味情诗</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" class="stage is-full" aria-label="原味情诗朗诵展示">
  <div id="sceneBg" class="scene-bg" aria-hidden="true"></div>
  <header class="masthead">
    <div class="brand">
      <span class="brand-eyebrow" id="eyebrow">原味情诗 · 朗诵</span>
      <span class="brand-title" id="brandTitle">替代心声</span>
    </div>
    <div class="chapter" id="chapter" aria-label="第零节">
      <span class="chapter-pre">第</span><span class="chapter-now" id="chapterNow">零</span><span class="chapter-post">节</span>
    </div>
  </header>

  <section class="panel panel-left" aria-label="朗读内容">
    <div class="wheel-viewport" id="wheelViewport">
      <div class="wheel" id="wheel"></div>
    </div>
  </section>

  <section class="panel panel-right" aria-label="展示内容">
    <div class="stack-fade" id="stackFade">
      <div class="stack" id="stack"></div>
    </div>
  </section>

  <div class="hint" id="hint">
    <span id="hintMain">点击任意处 · 下一行</span>
    <span class="hint-keys" id="hintKeys"><kbd>←</kbd> 上一行</span>
  </div>
</main>

<button type="button" id="openPlayer" class="player-reopen glass" aria-label="打开音乐播放器" title="打开音乐播放器" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5V6.8l9-2.1v11.6a2.6 2.6 0 1 1-1.6-2.4V8.2L10.6 9.8v8.7A2.6 2.6 0 1 1 9 18.5z"/></svg>
</button>

<section id="player" class="player glass" aria-label="音乐播放器">
  <div id="now-cover" class="now-cover" aria-hidden="true"><span id="coverGlyph">♪</span></div>
  <div class="player-transport" role="group" aria-label="播放控制">
    <button type="button" id="prev-track" class="player-btn" aria-label="上一首（随章节自动切换）" title="随章节自动切换" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h2.4v13H6z"/><path d="M19 5.5v13L8.6 12z"/></svg></button>
    <button type="button" id="play-toggle" class="player-play" aria-label="播放" title="播放"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.4v13.2L19 12z"/></svg></button>
    <button type="button" id="next-track" class="player-btn" aria-label="下一首（随章节自动切换）" title="随章节自动切换" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5.5h2.4v13H16z"/><path d="M5 5.5v13L15.4 12z"/></svg></button>
  </div>
  <div class="player-copy"><strong id="now-title">音乐</strong><span id="now-lyric">进入第一节后准备 BGM</span></div>
  <span id="time">0:00 / 0:00</span>
  <input id="seek" type="range" min="0" max="100" value="0" step="0.01" aria-label="播放进度">
  <button type="button" id="play-mode" class="player-btn" aria-label="播放模式：顺序播放（点击切换）" title="播放模式：顺序播放（点击切换）"></button>
  <span id="play-mode-tip" class="player-mode-tip" role="status" aria-live="polite"></span>
  <button type="button" id="close-player" class="player-btn player-close" aria-label="收起播放器" title="收起播放器"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
</section>

<audio id="audio" preload="none"></audio>

<div id="gongOverlay" class="gong-overlay" aria-hidden="true"><img src="assets/gong.png" alt=""></div>
<div id="veil" class="veil" aria-hidden="true"></div>

<noscript><p class="noscript">这个页面需要 JavaScript 才能滚动文字。</p></noscript>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
