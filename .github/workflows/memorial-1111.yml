name: memorial-1111

# 11.11（姥爷忌日）悼念模式：首页灰度 + hero 标语换成「谨致哀思，永怀不忘 / In loving memories of my grandfather」。
# 北京时间 00:00 上线、23:59 下线；**只改首页 index.html，子页面不动**。
#
# 时区（核对：中国标准时间 UTC+8，全年无夏令时，所以是固定换算，不会漂）：
#   11-11 00:00 CST = 11-10 16:00 UTC  →  cron '0 16 10 11 *'
#   11-11 23:59 CST = 11-11 15:59 UTC  →  cron '59 15 11 11 *'
#
# 两个 cron 只是「触发器」，开/关由 tools/memorial.mjs 按北京时间判断（窗口 = 11-11 00:00 ≤ now < 23:59）：
#   · 窗口内 → 在 index.html 插入 <!-- home-only:start -->…<!-- home-only:end --> 区块（灰度 + 悼念文案）
#   · 窗口外 → 删掉这个区块
# 于是重跑、被 GitHub 延后几分钟、手动触发，结果都一致（幂等），也不会出现「忘了下线」。
# 守护 cron 每天 12:00 CST 再兜一次底：万一 23:59 那次失败/被跳过，第二天中午一定把灰度收掉。
#
# 子页面为什么不受影响：区块整段包在 home-only 里，tools/build-content.mjs 以 index.html 为模板
# 生成预渲染页时会整段剔除（CSS 也另有一道 body:not(.reading) 的闸）。
#
# 最后一步不是摆设：推送只代表「让 Pages 去部署」，Pages 构建本身会失败/卡住（2026-11-09 实测整批 errored）。
# 所以流程会盯到本次 HEAD 真的 built（必要时 POST 重建），改过内容却没部署上去就让任务变红。
#
# 提前预览：Actions → memorial-1111 → Run workflow → state=on；看完再跑一次 state=off（或 state=auto）。
# 本地预览：node tools/memorial.mjs --state on / --state off（不带 --state 就是按日期自动判断）。

on:
  schedule:
    - cron: '0 16 10 11 *'   # 11-11 00:00 (UTC+8)：上线
    - cron: '59 15 11 11 *'  # 11-11 23:59 (UTC+8)：下线
    - cron: '0 4 * * *'      # 每天 12:00 (UTC+8)：窗口外自愈（该下线就下线，不该上线就不动）
  workflow_dispatch:
    inputs:
      state:
        description: 'auto = 按北京时间判断（11.11 开，其余关）｜on = 强制上线｜off = 强制下线'
        type: choice
        # 三个值都要加引号：YAML 会把裸 on / off 当成布尔值（GitHub 的 dispatch 接口会拒收）
        options: ['auto', 'on', 'off']
        default: 'auto'

permissions:
  contents: write
  pages: write      # 只用来读构建状态 / 必要时 POST 一次重建（2026-11-09 真踩到 Pages 构建服务抽风）

concurrency:
  group: memorial-1111
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 按北京时间判断并应用（幂等）
        id: toggle
        env:
          STATE: ${{ github.event.inputs.state || 'auto' }}
        run: node tools/memorial.mjs --state "$STATE"

      - name: 有变化就提交（推 main 即触发 Pages 重建）
        if: steps.toggle.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html 没有实际变化，不提交"
            exit 0
          fi
          git commit -m "chore(memorial): 11.11 悼念首页 ${{ steps.toggle.outputs.mode }} @ $(date -u +%Y-%m-%dT%H:%MZ)"
          # 和 stats 定时任务撞车时自动重试一次（两边改的不是同一批文件，rebase 安全）
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "第 $i 次推送失败，拉取后重试" >&2
            git pull --rebase --autostash
          done
          echo "::error::三次推送都失败"
          exit 1

      # 推送只是「让 Pages 去部署」，不等于「已经上线」：GitHub 的 Pages 构建偶发失败/卡住
      # （2026-11-09 18:55 CST 就整批 errored）。这一步盯到本次 HEAD 真的 built 为止，
      # 看到 errored 就 POST 一次重建；改了内容却等不到部署 → 让任务变红，别让 11.11 静悄悄没上线。
      - name: 确认 Pages 真的部署了这一版（失败就补触发构建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: ${{ steps.toggle.outputs.changed }}
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"
          sha=$(git rev-parse HEAD)
          echo "HEAD=$sha（本次是否改了内容：${CHANGED}）"
          api() { gh api "$@" 2>/dev/null; }
          rebuild() {
            echo "→ 申请重建 Pages"
            if api -X POST "repos/$repo/pages/builds" >/dev/null; then echo "  已排队"; else echo "  申请失败"; fi
          }
          # 构建出来的 commit 可能比 HEAD 新（比如 stats 机器人抢先推了一笔）：只要 HEAD 是它的祖先就算数
          confirms() {
            [ -z "$1" ] && return 1
            [ "$1" = "$sha" ] && return 0
            st=$(api "repos/$repo/compare/$sha...$1" --jq '.status')
            [ "$st" = "identical" ] || [ "$st" = "ahead" ]
          }
          tried=0
          for i in $(seq 1 45); do
            json=$(api "repos/$repo/pages/builds/latest")
            status=$(printf '%s' "$json" | jq -r '.status // "unknown"')
            built=$(printf '%s' "$json" | jq -r '.commit // ""')
            echo "[$i/45] Pages：$status ${built:0:7}"
            if [ "$status" = "built" ] && confirms "$built"; then
              echo "✅ Pages 已部署 ${sha:0:7}"
              exit 0
            fi
            if [ "$status" = "errored" ] && [ "$tried" -lt 2 ]; then
              tried=$((tried + 1)); rebuild; sleep 20; continue
            fi
            sleep 10
          done
          if [ "$CHANGED" = "true" ]; then
            echo "::error::等了 7 分半，Pages 仍未部署 ${sha:0:7}——线上可能还是旧版；Pages 恢复后手动 Run workflow 一次即可"
            exit 1
          fi
          echo "::warning::Pages 当前构建状态不理想（${status:-unknown}），本次内容没变，下次定时任务会再确认"
